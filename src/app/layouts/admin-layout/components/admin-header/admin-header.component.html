<header class="admin-header">
  <div>
    <p class="mb-0 text-muted small">Khu vực quản trị</p>
    <h1 class="mb-0">Clothing Store</h1>
  </div>

  <div class="d-flex align-items-center gap-3">
    <a routerLink="/" class="btn btn-outline-dark btn-sm">
      <i class="bi bi-box-arrow-up-right me-1"></i>
      Xem cửa hàng
    </a>

    <ng-container *ngIf="currentUser$ | async as user">
      <span class="d-none d-sm-inline">{{ user.fullName }}</span>

      <button class="btn btn-dark btn-sm" (click)="logout()">Đăng xuất</button>
    </ng-container>
  </div>
</header>
