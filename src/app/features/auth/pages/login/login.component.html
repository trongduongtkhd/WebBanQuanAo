<div class="auth-page">
  <form class="auth-card" [formGroup]="loginForm" (ngSubmit)="submit()">
    <a routerLink="/" class="brand">CLOTHING STORE</a>

    <h1>Chào mừng trở lại</h1>
    <p class="text-muted">Đăng nhập để tiếp tục mua sắm.</p>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div class="mb-3">
      <label class="form-label" for="email">Email</label>
      <input
        id="email"
        type="email"
        class="form-control"
        formControlName="email"
        placeholder="example@email.com"
      />
      <small *ngIf="email?.touched && email?.invalid" class="text-danger">
        Vui lòng nhập email hợp lệ.
      </small>
    </div>

    <div class="mb-4">
      <label class="form-label" for="password">Mật khẩu</label>
      <input
        id="password"
        type="password"
        class="form-control"
        formControlName="password"
        placeholder="Nhập mật khẩu"
      />
      <small *ngIf="password?.touched && password?.invalid" class="text-danger">
        Vui lòng nhập mật khẩu.
      </small>
    </div>

    <button type="submit" class="btn btn-dark w-100" [disabled]="isSubmitting">
      {{ isSubmitting ? "Đang đăng nhập..." : "Đăng nhập" }}
    </button>

    <p class="text-center mt-4 mb-0">
      Chưa có tài khoản?
      <a routerLink="/auth/register">Đăng ký ngay</a>
    </p>
  </form>
</div>
