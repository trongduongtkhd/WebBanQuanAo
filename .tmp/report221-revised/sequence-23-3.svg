án COD]</text><line x1="1000" y1="430" x2="1850" y2="430"  marker-end="url(#call)"/><rect x="1184.1" y="381" width="481.8" height="34" style="fill:white;stroke:none"/><text x="1425" y="409" text-anchor="middle" font-size="29">1. Đặt Payment và Order = Paid</text><line x1="1850" y1="490" x2="1000" y2="490" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="1215.42" y="441" width="419.16" height="34" style="fill:white;stroke:none"/><text x="1425" y="469" text-anchor="middle" font-size="29">2. Trạng thái trong bộ nhớ</text><line x1="1000" y1="572" x2="1450" y2="572"  marker-end="url(#call)"/><rect x="1054.57" y="523" width="340.86" height="34" style="fill:white;stroke:none"/><text x="1225" y="551" text-anchor="middle" font-size="29">3. SaveChangesAsync()</text><line x1="1450" y1="632" x2="2260" y2="632"  marker-end="url(#call)"/><rect x="1629.76" y="583" width="450.48" height="34" style="fill:white;stroke:none"/><text x="1855" y="611" text-anchor="middle" font-size="29">4. Lưu trạng thái và lịch sử</text><line x1="2260" y1="692" x2="1450" y2="692" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="1715.8899999999999" y="643" width="278.22" height="34" style="fill:white;stroke:none"/><text x="1855" y="671" text-anchor="middle" font-size="29">5. Lưu thành công</text><line x1="1450" y1="752" x2="1000" y2="752" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="1109.38" y="703" width="231.24" height="34" style="fill:white;stroke:none"/><text x="1225" y="731" text-anchor="middle" font-size="29">6. Kết quả lưu</text><path d="M1000,817H1105V840H1000" marker-end="url(#call)"/><rect x="1055.23" y="763" width="309.54" height="34" style="fill:white;stroke:none"/><text x="1210" y="791" text-anchor="middle" font-size="29">7. Commit giao dịch</text><line x1="1000" y1="900" x2="550" y2="900" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="620.23" y="851" width="309.54" height="34" style="fill:white;stroke:none"/><text x="775" y="879" text-anchor="middle" font-size="29">8. Chi tiết đơn mới</text><line x1="550" y1="960" x2="135" y2="960" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="187.73" y="911" width="309.54" height="34" style="fill:white;stroke:none"/><text x="342.5" y="939" text-anchor="middle" font-size="29">9. Hiển thị kết quả</text><path d="M48,995H2328l24,24V1045H48Z M2328,995v24h24" style="fill:white;stroke:#555"/><text x="1200" y="1023" text-anchor="middle" font-size="28" >VNPAY đã Paid/Refunded: chặn hủy vì hoàn qua cổng chưa hỗ trợ. Lỗi trong giao dịch: rollback.</text></svg>