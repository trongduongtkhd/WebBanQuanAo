<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="874" viewBox="0 0 2400 874"><rect width="100%" height="100%" style="fill:white;stroke:none"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}path,line,rect,circle{stroke:#111;stroke-width:2.2;fill:none}</style><defs><marker id="call" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9Z" style="fill:#111"/></marker><marker id="return" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9"/></marker></defs><circle cx="135" cy="24" r="12"/><path d="M135,36v39m-23,-23h46m-23,23l-25,30m25,-30l25,30"/><text x="135" y="125" text-anchor="middle" font-size="28" font-weight="bold">Khách hàng</text><line x1="135" y1="184" x2="135" y2="860" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="550" cy="51" r="28"/><path d="M506,19v64m0,-32h16"/><text x="550" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Form</text><text x="550" y="158" text-anchor="middle" font-size="28" font-weight="bold">Giao diện Angular</text><line x1="550" y1="184" x2="550" y2="860" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1000" cy="51" r="28"/><path d="M1002,17l-10,8l12,5"/><text x="1000" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Control</text><text x="1000" y="158" text-anchor="middle" font-size="28" font-weight="bold">Order Control</text><line x1="1000" y1="184" x2="1000" y2="860" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1450" cy="51" r="28"/><path d="M1452,17l-10,8l12,5"/><text x="1450" y="125" text-anchor="middle" font-size="28" font-weight="bold">: DBManager</text><text x="1450" y="158" text-anchor="middle" font-size="28" font-weight="bold">AppDbContext / EF</text><line x1="1450" y1="184" x2="1450" y2="860" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1850" cy="51" r="28"/><path d="M1819,82h62"/><text x="1850" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Entity</text><text x="1850" y="158" text-anchor="middle" font-size="28" font-weight="bold">Order / OrderItem</text><line x1="1850" y1="184" x2="1850" y2="860" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><rect x="2231" y="22" width="58" height="58"/><path d="M2231,22l58,58m0,-58l-58,58"/><text x="2260" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Database</text><text x="2260" y="158" text-anchor="middle" font-size="28" font-weight="bold">SQL Server</text><line x1="2260" y1="184" x2="2260" y2="860" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><rect x="25" y="381" width="2350" height="454"/><path d="M25,421h75l18,-15v-25"/><text x="45" y="410" text-anchor="start" font-size="27" font-weight="bold">alt</text><rect x="542" y="184" width="16" height="397" style="fill:white"/><rect x="992" y="184" width="16" height="337" style="fill:white"/><rect x="48" y="206" width="2304" height="50" style="fill:white;stroke:#555"/><path d="M48,246h72l17,-17v-23"/><text x="63" y="235" text-anchor="start" font-size="26" font-weight="bold">ref</text><text x="1235" y="234" text-anchor="middle" font-size="28" >tiếp tục trạng thái và nhánh đang xử lý ở phần trước.</text><path d="M1000,348H1105V371H1000" marker-end="url(#call)"/><rect x="1008.25" y="263" width="403.5" height="34" style="fill:white;stroke:none"/><text x="1210" y="291" text-anchor="middle" font-size="29">1. Kiểm tra địa chỉ, tồn;</text><rect x="1086.55" y="297" width="246.9" height="34" style="fill:white;stroke:none"/><text x="1210" y="325" text-anchor="middle" font-size="29">kiểm tra lại mã</text><rect x="135" y="384" width="2225" height="51" style="fill:white;stroke:none"/><text x="145" y="411" text-anchor="start" font-size="29" >[Có điều kiện không hợp lệ]</text><line x1="1000" y1="521" x2="550" y2="521" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="573.25" y="441" width="403.5" height="34" style="fill:white;stroke:none"/><text x="775" y="469" text-anchor="middle" font-size="29">2. Từ chối; trả thông báo</text><rect x="745.51" y="475" width="58.980000000000004" height="34" style="fill:white;stroke:none"/><text x="775" y="503" text-anchor="middle" font-size="29">lỗi</text><line x1="550" y1="581" x2="135" y2="581" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="187.73" y="532" width="309.54" height="34" style="fill:white;stroke:none"/><text x="342.5" y="560" text-anchor="middle" font-size="29">3. Hiển thị kết quả</text><line x1="25" x2="2375" y1="591" y2="591" stroke-dasharray="9 7"/><rect x="135" y="594" width="2225" height="50" style="fill:white;stroke:none"/><text x="145" y="621" text-anchor="start" font-size="29" >[Điều kiện hợp lệ]</text><path d="M1000,735H1105V758H1000" marker-end="url(#call)"/><rect x="1039.57" y="650" width="340.86" height="34" style="fill:white;stroke:none"/><text x="1210" y="678" text-anchor="middle" font-size="29">4. Tự tính tiền hàng,</text><rect x="1094.38" y="684" width="231.24" height="34" style="fill:white;stroke:none"/><text x="1210" y="712" text-anchor="middle" font-size="29">giảm, phí giao</text><path d="M48,771H2328l24,24V821H48Z M2328,771v24h24" style="fill:white;stroke:#555"/><text x="1200" y="799" text-anchor="middle" font-size="28" >Tiếp phần tiếp theo: chỉ nhánh hợp lệ; lỗi trong giao dịch dẫn đến rollback.</text></svg>