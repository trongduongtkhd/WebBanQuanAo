or="middle" font-size="29">8. Hiển thị kết quả</text><path d="M48,1005H2328l24,24V1055H48Z M2328,1005v24h24" style="fill:white;stroke:#555"/><text x="1200" y="1033" text-anchor="middle" font-size="28" >Upload chỉ tạo tệp và URL. Chưa tạo bản ghi ProductImage; tiếp phần tiếp theo để gắn ảnh vào sản phẩm.</text></svg>