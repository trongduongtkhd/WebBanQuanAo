<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1146" viewBox="0 0 2400 1146"><rect width="100%" height="100%" style="fill:white;stroke:none"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}path,line,rect,circle{stroke:#111;stroke-width:2.2;fill:none}</style><defs><marker id="call" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9Z" style="fill:#111"/></marker><marker id="return" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9"/></marker></defs><circle cx="135" cy="24" r="12"/><path d="M135,36v39m-23,-23h46m-23,23l-25,30m25,-30l25,30"/><text x="135" y="125" text-anchor="middle" font-size="28" font-weight="bold">Khách hàng</text><line x1="135" y1="184" x2="135" y2="1132" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="550" cy="51" r="28"/><path d="M506,19v64m0,-32h16"/><text x="550" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Form</text><text x="550" y="158" text-anchor="middle" font-size="28" font-weight="bold">Giao diện Angular</text><line x1="550" y1="184" x2="550" y2="1132" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1000" cy="51" r="28"/><path d="M1002,17l-10,8l12,5"/><text x="1000" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Control</text><text x="1000" y="158" text-anchor="middle" font-size="28" font-weight="bold">Auth Control</text><line x1="1000" y1="184" x2="1000" y2="1132" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1450" cy="51" r="28"/><path d="M1452,17l-10,8l12,5"/><text x="1450" y="125" text-anchor="middle" font-size="28" font-weight="bold">: DBManager</text><text x="1450" y="158" text-anchor="middle" font-size="28" font-weight="bold">AppDbContext / EF</text><line x1="1450" y1="184" x2="1450" y2="1132" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1850" cy="51" r="28"/><path d="M1819,82h62"/><text x="1850" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Entity</text><text x="1850" y="158" text-anchor="middle" font-size="28" font-weight="bold">User / UserRole</text><line x1="1850" y1="184" x2="1850" y2="1132" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><rect x="2231" y="22" width="58" height="58"/><path d="M2231,22l58,58m0,-58l-58,58"/><text x="2260" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Database</text><text x="2260" y="158" text-anchor="middle" font-size="28" font-weight="bold">SQL Server</text><line x1="2260" y1="184" x2="2260" y2="1132" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><rect x="25" y="532" width="2350" height="575"/><path d="M25,572h75l18,-15v-25"/><text x="45" y="561" text-anchor="start" font-size="27" font-weight="bold">alt</text><rect x="2252" y="910" width="16" height="60" style="fill:white"/><rect x="1442" y="850" width="16" height="180" style="fill:white"/><rect x="542" y="284" width="16" height="417" style="fill:white"/><rect x="992" y="344" width="16" height="297" style="fill:white"/><line x1="135" y1="284" x2="550" y2="284"  marker-end="url(#call)"/><rect x="164.23999999999998" y="204" width="356.52000000000004" height="34" style="fill:white;stroke:none"/><text x="342.5" y="232" text-anchor="middle" font-size="29">1. Nhập thông tin đăng</text><rect x="320.84" y="238" width="43.32" height="34" style="fill:white;stroke:none"/><text x="342.5" y="266" text-anchor="middle" font-size="29">ký</text><line x1="550" y1="344" x2="1000" y2="344"  marker-end="url(#call)"/><rect x="620.23" y="295" width="309.54" height="34" style="fill:white;stroke:none"/><text x="775" y="323" text-anchor="middle" font-size="29">2. Gửi yêu cầu HTTP</text><path d="M48,357H2328l24,24V407H48Z M2328,357v24h24" style="fill:white;stroke:#555"/><text x="1200" y="385" text-anchor="middle" font-size="28" >Control gồm AuthController và AuthService; kiểm tra DTO trước nghiệp vụ.</text><path d="M1000,499H1105V522H1000" marker-end="url(#call)"/><rect x="1016.0799999999999" y="414" width="387.84000000000003" height="34" style="fill:white;stroke:none"/><text x="1210" y="442" text-anchor="middle" font-size="29">3. Xác minh CAPTCHA bằng</text><rect x="1133.53" y="448" width="152.94" height="34" style="fill:white;stroke:none"/><text x="1210" y="476" text-anchor="middle" font-size="29">Turnstile</text><rect x="135" y="535" width="2225" height="51" style="fill:white;stroke:none"/><text x="145" y="562" text-anchor="start" font-size="29" >[CAPTCHA sai / không xác minh được]</text><line x1="1000" y1="641" x2="550" y2="641" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="628.06" y="592" width="293.88" height="34" style="fill:white;stroke:none"/><text x="775" y="620" text-anchor="middle" font-size="29">4. Từ chối đăng ký</text><line x1="550" y1="701" x2="135" y2="701" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="187.73" y="652" width="309.54" height="34" style="fill:white;stroke:none"/><text x="342.5" y="680" text-anchor="middle" font-size="29">5. Hiển thị kết quả</text><line x1="25" x2="2375" y1="711" y2="711" stroke-dasharray="9 7"/><rect x="135" y="714" width="2225" height="50" style="fill:white;stroke:none"/><text x="145" y="741" text-anchor="start" font-size="29" >[CAPTCHA hợp lệ]</text><line x1="1000" y1="850" x2="1450" y2="850"  marker-end="url(#call)"/><rect x="1007.5899999999999" y="770" width="434.82000000000005" height="34" style="fill:white;stroke:none"/><text x="1225" y="798" text-anchor="middle" font-size="29">6. Kiểm tra email; lấy role</text><rect x="1156.36" y="804" width="137.28" height="34" style="fill:white;stroke:none"/><text x="1225" y="832" text-anchor="middle" font-size="29">Customer</text><line x1="1450" y1="910" x2="2260" y2="910"  marker-end="url(#call)"/><rect x="1661.08" y="861" width="387.84000000000003" height="34" style="fill:white;stroke:none"/><text x="1855" y="889" text-anchor="middle" font-size="29">7. Thực