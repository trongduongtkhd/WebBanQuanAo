;stroke:none"/><text x="1210" y="898" text-anchor="middle" font-size="29">ràng buộc xóa</text><path d="M48,957H2328l24,24V1007H48Z M2328,957v24h24" style="fill:white;stroke:#555"/><text x="1200" y="985" text-anchor="middle" font-size="28" >Tiếp phần tiếp theo: áp dụng đúng quy tắc của từng loại dữ liệu.</text></svg>