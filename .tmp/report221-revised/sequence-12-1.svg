<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="917" viewBox="0 0 2400 917"><rect width="100%" height="100%" style="fill:white;stroke:none"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}path,line,rect,circle{stroke:#111;stroke-width:2.2;fill:none}</style><defs><marker id="call" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9Z" style="fill:#111"/></marker><marker id="return" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9"/></marker></defs><circle cx="135" cy="24" r="12"/><path d="M135,36v39m-23,-23h46m-23,23l-25,30m25,-30l25,30"/><text x="135" y="125" text-anchor="middle" font-size="28" font-weight="bold">Khách hàng</text><line x1="135" y1="184" x2="135" y2="903" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="550" cy="51" r="28"/><path d="M506,19v64m0,-32h16"/><text x="550" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Form</text><text x="550" y="158" text-anchor="middle" font-size="28" font-weight="bold">Giao diện Angular</text><line x1="550" y1="184" x2="550" y2="903" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1000" cy="51" r="28"/><path d="M1002,17l-10,8l12,5"/><text x="1000" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Control</text><text x="1000" y="158" text-anchor="middle" font-size="28" font-weight="bold">Address Control</text><line x1="1000" y1="184" x2="1000" y2="903" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1450" cy="51" r="28"/><path d="M1452,17l-10,8l12,5"/><text x="1450" y="125" text-anchor="middle" font-size="28" font-weight="bold">: DBManager</text><text x="1450" y="158" text-anchor="middle" font-size="28" font-weight="bold">AppDbContext / EF</text><line x1="1450" y1="184" x2="1450" y2="903" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1850" cy="51" r="28"/><path d="M1819,82h62"/