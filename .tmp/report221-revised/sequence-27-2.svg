<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="855" viewBox="0 0 2400 855"><rect width="100%" height="100%" style="fill:white;stroke:none"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}path,line,rect,circle{stroke:#111;stroke-width:2.2;fill:none}</style><defs><marker id="call" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9Z" style="fill:#111"/></marker><marker id="return" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9"/></marker></defs><circle cx="135" cy="24" r="12"/><path d="M135,36v39m-23,-23h46m-23,23l-25,30m25,-30l25,30"/><text x="135" y="125" text-anchor="middle" font-size="28" font-weight="bold">Quản trị viên</text><line x1="135" y1="184" x2="135" y2="841" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="550" cy="51" r="28"/><path d="M506,19v64m0,-32h16"/><text x="550" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Form</text><text x="550" y="158" text-anchor="middle" font-size="28" font-weight="bold">Giao diện Angular</text><line x1="550" y1="184" x2="550" y2="841" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1000" cy="51" r="28"/><path d="M1002,17l-10,8l12,5"/><text x="1000" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Control</text><text x="1000" y="158" text-anchor="middle" font-size="28" font-weight="bold">Dashboard Control</text><line x1="1000" y1="184" x2="1000" y2="841" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1450" cy="51" r="28"/><path d="M1452,17l-10,8l12,5"/><text x="1450" y="125" text-anchor="middle" font-size="28" font-weight="bold">: DBManager</text><text x="1450" y="158" text-anchor="middle" font-size="28" font-weight="bold">AppDbContext / EF</text><line x1="1450" y1="184" x2="1450" y2="841" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1850" cy="51" r="28"/><path d="M1819,82h62"/><text x="1850" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Entity</text><text x="1850" y="158" text-anchor="middle" font-size="28" font-weight="bold">OrderItem / Variant</text><line x1="1850" y1="184" x2="1850" y2="841" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><rect x="2231" y="22" width="58" height="58"/><path d="M2231,22l58,58m0,-58l-58,58"/><text x="2260" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Database</text><text x="2260" y="158" text-anchor="middle" font-size="28" font-weight="bold">SQL Server</text><line x1="2260" y1="184" x2="2260" y2="841" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><rect x="1842" y="312" width="16" height="60" style="fill:white"/><rect x="542" y="184" width="16" height="577" style="fill:white"/><rect x="992" y="184" width="16" height="517" style="fill:white"/><rect x="48" y="206" width="2304" height="50" style="fill:white;stroke:#555"/><path d="M48,246h72l17,-17v-23"/><text x="63" y="235" text-anchor="start" font-size="26" font-weight="bold">ref</text><text x="1235" y="234" text-anchor="middle" font-size="28" >phần trước đã xác nhận khoảng ngày và truy vấn thống kê.</text><line x1="1000" y1="312" x2="1850" y2="312"  marker-end="url(#call)"/><rect x="1137.12" y="263" width="575.76" height="34" style="fill:white;stroke:none"/><text x="1425" y="291" text-anchor="middle" font-size="29">1. Đọc số lượng, giá bán và UnitCost</text><line x1="1850" y1="372" x2="1000" y2="372" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="1215.42" y="323" width="419.16" height="34" style="fill:white;stroke:none"/><text x="1425" y="351" text-anchor="middle" font-size="29">2. Trạng thái trong bộ nhớ</text><path d="M1000,468H1105V491H1000" marker-end="url(#call)"/><rect x="1031.74" y="383" width="356.52000000000004" height="34" style="fill:white;stroke:none"/><text x="1210" y="411" text-anchor="middle" font-size="29">3. Tính doanh thu, giá</text><rect x="1094.38" y="417" width="231.24" height="34" style="fill:white;stroke:none"/><text x="1210" y="445" text-anchor="middle" font-size="29">vốn, lợi nhuận</text><path d="M1000,587H1105V610H1000" marker-end="url(#call)"/><rect x="1031.74" y="502" width="356.52000000000004" height="34" style="fill:white;stroke:none"/><text x="1210" y="530" text-anchor="middle" font-size="29">4. Tổng hợp đơn chờ và</text><rect x="1102.21" y="536" width="215.58" height="34" style="fill:white;stroke:none"/><text x="1210" y="564" text-anchor="middle" font-size="29">hàng bán chạy</text><line x1="1000" y1="701" x2="550" y2="701" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="581.0799999999999" y="621" width="387.84000000000003" height="34" style="fill:white;stroke:none"/><text x="775" y="649" text-anchor="middle" font-size="29">5. DashboardDto; biểu đồ</text><rect x="706.36" y="655" width="137.28" height="34" style="fill:white;stroke:none"/><text x="775" y="683" text-anchor="middle" font-size="29">thống kê</text><line x1="550" y1="761" x2="135" y2="761" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="187.73" y="712" width="309.54" height="34" style="fill:white;stroke:none"/><text x="342.5" y="740" text-anchor="middle" font-size="29">6. Hiển thị kết quả</text><path d="M48,774H2328l24,24V824H48Z M2328,774v24h24" style="fill:white;stroke:#555"/><text x="1200" y="802" text-anchor="middle" font-size="28" >Tổng khách hàng và danh sách hàng tồn thấp phản ánh dữ liệu hiện tại; không gán cùng phạm vi ngày cho tất cả chỉ số.</text></svg>