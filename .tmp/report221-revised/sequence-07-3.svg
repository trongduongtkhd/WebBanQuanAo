text x="1225" y="411" text-anchor="middle" font-size="29">3. Tìm họ refresh token của</text><rect x="1179.85" y="417" width="90.30000000000001" height="34" style="fill:white;stroke:none"/><text x="1225" y="445" text-anchor="middle" font-size="29">phiên</text><line x1="1450" y1="523" x2="2260" y2="523"  marker-end="url(#call)"/><rect x="1661.08" y="474" width="387.84000000000003" height="34" style="fill:white;stroke:none"/><text x="1855" y="502" text-anchor="middle" font-size="29">4. Thực thi truy vấn SQL</text><line x1="2260" y1="583" x2="1450" y2="583" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="1739.38" y="534" width="231.24" height="34" style="fill:white;stroke:none"/><text x="1855" y="562" text-anchor="middle" font-size="29">5. Các bản ghi</text><line x1="1450" y1="643" x2="1000" y2="643" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="1007.5899999999999" y="594" width="434.82000000000005" height="34" style="fill:white;stroke:none"/><text x="1225" y="622" text-anchor="middle" font-size="29">6. Các token trong họ phiên</text><line x1="1000" y1="703" x2="1850" y2="703"  marker-end="url(#call)"/><rect x="1176.27" y="654" width="497.46000000000004" height="34" style="fill:white;stroke:none"/><text x="1425" y="682" text-anchor="middle" font-size="29">7. Đánh dấu thu hồi cả họ token</text><line x1="1850" y1="763" x2="1000" y2="763" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="1215.42" y="714" width="419.16" height="34" style="fill:white;stroke:none"/><text x="1425" y="742" text-anchor="middle" font-size="29">8. Trạng thái trong bộ nhớ</text><line x1="1000" y1="823" x2="1450" y2="823"  marker-end="url(#call)"/><rect x="1054.57" y="774" width="340.86" height="34" style="fill:white;stroke:none"/><text x="1225" y="802" text-anchor="middle" font-size="29">9. SaveChangesAsync()</text><line x1="1450" y1="883" x2="2260" y2="883"  marker-end="url(#call)"/><rect x="1692.4" y="834" width="325.20000000000005" height="34" style="fill:white;s