<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="907" viewBox="0 0 2400 907"><rect width="100%" height="100%" style="fill:white;stroke:none"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}path,line,rect,circle{stroke:#111;stroke-width:2.2;fill:none}</style><defs><marker id="call" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9Z" style="fill:#111"/></marker><marker id="return" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L10 4.5L0 9"/></marker></defs><circle cx="135" cy="24" r="12"/><path d="M135,36v39m-23,-23h46m-23,23l-25,30m25,-30l25,30"/><text x="135" y="125" text-anchor="middle" font-size="28" font-weight="bold">Khách hàng</text><line x1="135" y1="184" x2="135" y2="893" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="550" cy="51" r="28"/><path d="M506,19v64m0,-32h16"/><text x="550" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Form</text><text x="550" y="158" text-anchor="middle" font-size="28" font-weight="bold">Giao diện Angular</text><line x1="550" y1="184" x2="550" y2="893" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1000" cy="51" r="28"/><path d="M1002,17l-10,8l12,5"/><text x="1000" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Control</text><text x="1000" y="158" text-anchor="middle" font-size="28" font-weight="bold">MockQR Control</text><line x1="1000" y1="184" x2="1000" y2="893" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1450" cy="51" r="28"/><path d="M1452,17l-10,8l12,5"/><text x="1450" y="125" text-anchor="middle" font-size="28" font-weight="bold">: DBManager</text><text x="1450" y="158" text-anchor="middle" font-size="28" font-weight="bold">AppDbContext / EF</text><line x1="1450" y1="184" x2="1450" y2="893" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><circle cx="1850" cy="51" r="28"/><path d="M1819,82h62"/><text x="1850" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Entity</text><text x="1850" y="158" text-anchor="middle" font-size="28" font-weight="bold">Order / Payment</text><line x1="1850" y1="184" x2="1850" y2="893" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><rect x="2231" y="22" width="58" height="58"/><path d="M2231,22l58,58m0,-58l-58,58"/><text x="2260" y="125" text-anchor="middle" font-size="28" font-weight="bold">: Database</text><text x="2260" y="158" text-anchor="middle" font-size="28" font-weight="bold">SQL Server</text><line x1="2260" y1="184" x2="2260" y2="893" stroke-dasharray="7 8" style="stroke:#777;stroke-width:1.7"/><rect x="25" y="262" width="2350" height="547"/><path d="M25,302h75l18,-15v-25"/><text x="45" y="291" text-anchor="start" font-size="27" font-weight="bold">alt</text><rect x="1842" y="371" width="16" height="60" style="fill:white"/><rect x="2252" y="551" width="16" height="60" style="fill:white"/><rect x="1442" y="491" width="16" height="180" style="fill:white"/><rect x="542" y="184" width="16" height="607" style="fill:white"/><rect x="992" y="184" width="16" height="547" style="fill:white"/><rect x="48" y="206" width="2304" height="50" style="fill:white;stroke:#555"/><path d="M48,246h72l17,-17v-23"/><text x="63" y="235" text-anchor="start" font-size="26" font-weight="bold">ref</text><text x="1235" y="234" text-anchor="middle" font-size="28" >tiếp tục trạng thái và nhánh đang xử lý ở phần trước.</text><rect x="135" y="265" width="2225" height="51" style="fill:white;stroke:none"/><text x="145" y="292" text-anchor="start" font-size="29" >[Điều kiện hợp lệ; tiếp]</text><line x1="1000" y1="371" x2="1850" y2="371"  marker-end="url(#call)"/><rect x="1184.1" y="322" width="481.8" height="34" style="fill:white;stroke:none"/><text x="1425" y="350" text-anchor="middle" font-size="29">1. Đặt Payment và Order = Paid</text><line x1="1850" y1="431" x2="1000" y2="431" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="1215.42" y="382" width="419.16" height="34" style="fill:white;stroke:none"/><text x="1425" y="410" text-anchor="middle" font-size="29">2. Trạng thái trong bộ nhớ</text><line x1="1000" y1="491" x2="1450" y2="491"  marker-end="url(#call)"/><rect x="1054.57" y="442" width="340.86" height="34" style="fill:white;stroke:none"/><text x="1225" y="470" text-anchor="middle" font-size="29">3. SaveChangesAsync()</text><line x1="1450" y1="551" x2="2260" y2="551"  marker-end="url(#call)"/><rect x="1598.44" y="502" width="513.12" height="34" style="fill:white;stroke:none"/><text x="1855" y="530" text-anchor="middle" font-size="29">4. Lưu PaidAt và TransactionCode</text><line x1="2260" y1="611" x2="1450" y2="611" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="1715.8899999999999" y="562" width="278.22" height="34" style="fill:white;stroke:none"/><text x="1855" y="590" text-anchor="middle" font-size="29">5. Lưu thành công</text><line x1="1450" y1="671" x2="1000" y2="671" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="1109.38" y="622" width="231.24" height="34" style="fill:white;stroke:none"/><text x="1225" y="650" text-anchor="middle" font-size="29">6. Kết quả lưu</text><line x1="1000" y1="731" x2="550" y2="731" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="557.5899999999999" y="682" width="434.82000000000005" height="34" style="fill:white;stroke:none"/><text x="775" y="710" text-anchor="middle" font-size="29">7. Thông tin thanh toán mới</text><line x1="550" y1="791" x2="135" y2="791" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="187.73" y="742" width="309.54" height="34" style="fill:white;stroke:none"/><text x="342.5" y="770" text-anchor="middle" font-size="29">8. Hiển thị kết quả</text><path d="M48,826H2328l24,24V876H48Z M2328,826v24h24" style="fill:white;stroke:#555"/><text x="1200" y="854" text-anchor="middle" font-size="28" >MockQR là mô phỏng. Không thay thế IPN có chữ ký của VNPAY; COD được ghi nhận khi giao hàng hoàn tất.</text></svg>