ont-size="30">2. Gửi yêu cầu</text><rect x="481.6" y="431" width="76.80000000000001" height="35" style="fill:white;stroke:none"/><text x="520" y="460" text-anchor="middle" font-size="30">HTTP</text><line x1="660" y1="606" x2="940" y2="606"  marker-end="url(#call)"/><rect x="721.1" y="489" width="157.8" height="35" style="fill:white;stroke:none"/><text x="800" y="518" text-anchor="middle" font-size="30">3. Tìm họ</text><rect x="688.7" y="524" width="222.60000000000002" height="35" style="fill:white;stroke:none"/><text x="800" y="553" text-anchor="middle" font-size="30">refresh token</text><rect x="721.1" y="559" width="157.8" height="35" style="fill:white;stroke:none"/><text x="800" y="588" text-anchor="middle" font-size="30">của phiên</text><line x1="940" y1="666" x2="1490" y2="666"  marker-end="url(#call)"/><rect x="1014.6" y="617" width="400.8" height="35" style="fill:white;stroke:none"/><text x="1215" y="646" text-anchor="middle" font-size="30">4. Thực thi truy vấn SQL</text><line x1="1490" y1="726" x2="940" y2="726" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="1095.6" y="677" width="238.8" height="35" style="fill:white;stroke:none"/><text x="1215" y="706" text-anchor="middle" font-size="30">5. Các bản ghi</text><line x1="940" y1="819" x2="660" y2="819" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="696.8" y="737" width="206.4" height="35" style="fill:white;stroke:none"/><text x="800" y="766" text-anchor="middle" font-size="30">6. Các token</text><rect x="680.6" y="772" width="238.8" height="35" style="fill:white;stroke:none"/><text x="800" y="801" text-anchor="middle" font-size="30">trong họ phiên</text><line x1="660" y1="879" x2="1220" y2="879"  marker-end="url(#call)"/><rect x="682.9" y="830" width="514.2" height="35" style="fill:white;stroke:none"/><text x="940" y="859" text-anchor="middle" font-size="30">7. Đánh dấu thu hồi cả họ token</text><line x1="1220" y1="939" x2="660" y2="939" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="723.4" y="890" width="433.20000000000005" height="35" style="fill:white;stroke:none"/><text x="940" y="919" text-anchor="middle" font-size="30">8. Trạng thái trong bộ nhớ</text><line x1="660" y1="1032" x2="940" y2="1032"  marker-end="url(#call)"/><rect x="777.8" y="950" width="44.400000000000006" height="35" style="fill:white;stroke:none"/><text x="800" y="979" text-anchor="middle" font-size="30">9.</text><rect x="648.2" y="985" width="303.6" height="35" style="fill:white;stroke:none"/><text x="800" y="1014" text-anchor="middle" font-size="30">SaveChangesAsync()</text><line x1="940" y1="1092" x2="1490" y2="1092"  marker-end="url(#call)"/><rect x="1047" y="1043" width="336" height="35" style="fill:white;stroke:none"/><text x="1215" y="1072" text-anchor="middle" font-size="30">10. Lưu các thay đổi</text><line x1="1490" y1="1152" x2="940" y2="1152" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="1063.2" y="1103" width="303.6" height="35" style="fill:white;stroke:none"/><text x="1215" y="1132" text-anchor="middle" font-size="30">11. Lưu thành công</text><line x1="940" y1="1212" x2="660" y2="1212" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="672.5" y="1163" width="255.00000000000003" height="35" style="fill:white;stroke:none"/><text x="800" y="1192" text-anchor="middle" font-size="30">12. Kết quả lưu</text><line x1="660" y1="1305" x2="380" y2="1305" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="392.5" y="1223" width="255.00000000000003" height="35" style="fill:white;stroke:none"/><text x="520" y="1252" text-anchor="middle" font-size="30">13. Xóa refresh</text><rect x="424.9" y="1258" width="190.20000000000002" height="35" style="fill:white;stroke:none"/><text x="520" y="1287" text-anchor="middle" font-size="30">cookie; 200</text><line x1="380" y1="1398" x2="105" y2="1398" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="139.3" y="1316" width="206.4" height="35" style="fill:white;stroke:none"/><text x="242.5" y="1345" text-anchor="middle" font-size="30">14. Hiển thị</text><rect x="179.8" y="1351" width="125.4" height="35" style="fill:white;stroke:none"/><text x="242.5" y="1380" text-anchor="middle" font-size="30">kết quả</text><path d="M380,1531H450V1554H380" marker-end="url(#call)"/><rect x="395.6" y="1409" width="238.8" height="35" style="fill:white;stroke:none"/><text x="515" y="1438" text-anchor="middle" font-size="30">15. Xóa access</text><rect x="395.6" y="1444" width="238.8" height="35" style="fill:white;stroke:none"/><text x="515" y="1473" text-anchor="middle" font-size="30">token và trạng</text><rect x="428" y="1479" width="174" height="35" style="fill:white;stroke:none"/><text x="515" y="1508" text-anchor="middle" font-size="30">thái phiên</text><path d="M48,1567H1528l24,24V1653H48Z M1528,1567v24h24" style="fill:white;stroke:#555"/><text x="800" y="1595" text-anchor="middle" font-size="28" >Khi refresh lỗi, xóa cookie trừ trường hợp ConcurrentReuse để không ghi đè cookie mới của yêu cầu</text><text x="800" y="1628" text-anchor="middle" font-size="28" >thắng.</text></svg>