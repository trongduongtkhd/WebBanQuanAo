dle" font-size="30">2FA</text><line x1="1220" y1="1093" x2="660" y2="1093" stroke-dasharray="9 7" marker-end="url(#return)"/><rect x="723.4" y="1044" width="433.20000000000005" height="35" style="fill:white;stroke:none"/><text x="940" y="1073" text-anchor="middle" font-size="30">9. Trạng thái trong bộ nhớ</text><path d="M660,1226H730V1249H660" marker-end="url(#call)"/><rect x="691.8" y="1104" width="206.4" height="35" style="fill:white;stroke:none"/><text x="795" y="1133" text-anchor="middle" font-size="30">10. Kiểm tra</text><rect x="675.6" y="1139" width="238.8" height="35" style="fill:white;stroke:none"/><text x="795" y="1168" text-anchor="middle" font-size="30">khóa; xác minh</text><rect x="740.4" y="1174" width="109.2" height="35" style="fill:white;stroke:none"/><text x="795" y="1203" text-anchor="middle" font-size="30">BCrypt</text><path d="M48,1262H1528l24,24V1313H48Z M1528,1262v24h24" style="fill:white;stroke:#555"/><text x="800" y="1290" text-anchor="middle" font-size="28" >Tiếp phần tiếp theo: phân nhánh theo kết quả kiểm tra.</text></svg>